name: Publish documentation
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.site.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Assembly uses current tooling; release HTML always comes from its archive.
          ref: main
      - name: Select documentation Rust toolchain
        run: |
          rustup toolchain install "$(jq -r .rust docs/toolchain.json)" --profile minimal
          rustup default "$(jq -r .rust docs/toolchain.json)"
      - name: Assemble and check all published documentation versions
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo xtask docs-site
          echo "tag=$(jq -r '.latest // .versions[0].tag' target/documentation/published/versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/documentation/published
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check deployed pages and downloads
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DOCUMENTATION_TAG: ${{ needs.build.outputs.tag }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "${PAGE_URL}index.html" > /dev/null
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "${PAGE_URL}versions/index.html" > /dev/null
          for path in guide/index.html rust/battersea_flow/struct.FlowDocument.html typescript/modules/_battersea_editor.graph.html schemas/flow.schema.json; do
            curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "${PAGE_URL}${DOCUMENTATION_TAG}/${path}" > /dev/null
          done
