[package]
name = "battersea-mcp"
description = "Bounded MCP connections and immutable application tool bindings"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = false
include = ["src/**", "Cargo.toml", "LICENSE", "NOTICE"]

[features]
default = []
stdio = ["tokio/io-util"]
http = ["dep:reqwest", "dep:http", "dep:sse-stream", "rmcp/transport-streamable-http-client"]

[dependencies]
battersea-model = { path = "../battersea-model", version = "0.16.0" }
battersea-tools = { path = "../battersea-tools", version = "0.16.0" }
rmcp = { version = "=3.6.0", default-features = false, features = ["client"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, optional = true }
http = { version = "1", optional = true }
sse-stream = { version = "0.2.4", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
axum.workspace = true
