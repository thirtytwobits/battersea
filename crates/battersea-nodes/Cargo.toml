[package]
name = "battersea-nodes"
description = "Battersea nodes contracts and implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = false
include = ["src/**", "Cargo.toml", "LICENSE", "NOTICE"]

[features]
conformance = ["battersea-kit/conformance"]

[dependencies]
battersea-flow = { path = "../battersea-flow", version = "0.24.0" }
battersea-runtime = { path = "../battersea-runtime", version = "0.24.0" }
battersea-kit = { path = "../battersea-kit", version = "0.24.0" }
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio-util.workspace = true

[dev-dependencies]
battersea-kit = { path = "../battersea-kit", version = "0.24.0", features = ["conformance"] }
tokio.workspace = true
