[package]
name = "mcp-example"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
publish = false

[dependencies]
battersea-mcp = { path = "../../crates/battersea-mcp", features = ["stdio", "http"] }
battersea-model = { path = "../../crates/battersea-model" }
battersea-tools = { path = "../../crates/battersea-tools" }
battersea-providers = { path = "../../crates/battersea-providers", default-features = false, features = ["openai"] }
battersea-config = { path = "../../crates/battersea-config" }
clap.workspace = true
axum.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "process"] }
tokio-util.workspace = true
