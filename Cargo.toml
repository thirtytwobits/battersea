[workspace]
members = ["crates/battersea-flow", "crates/battersea-runtime", "tools/xtask", "examples/*"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/thirtytwobits/battersea"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tempfile = "3.20"
