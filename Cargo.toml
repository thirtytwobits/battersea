[workspace]
members = ["crates/battersea-pianola", "crates/battersea-flow", "crates/battersea-runtime", "crates/battersea-model", "crates/battersea-providers", "crates/battersea-config", "crates/battersea-nodes", "crates/battersea-guard", "tools/xtask", "examples/*"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/thirtytwobits/battersea"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tempfile = "3.20"

anyhow = "1.0.100"
async-openai = { version = "0.33.0", features = ["byot", "responses", "image"] }
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["ws", "json"] }
chrono = { version = "0.4.42", features = ["serde"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.31"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
regex-lite = "0.1.8"
schemars = { version = "1.0.4", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.17"
tracing = "0.1.41"
